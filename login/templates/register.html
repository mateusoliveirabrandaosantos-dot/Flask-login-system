<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='register.css')}}">
    <title>Registrar-Se</title>
</head>
<body>
    <h1>Registrar-Se</h1>
    <div class="login">
        <form method="POST" action="/register">
            <input type="text" id="name" name="name" class="name" required>
            <label for="name" class="l1">Name</label>
            <input type="email" id="email" name="email" class="email" required>
            <label for="email" class="l2">Email</label>
            <input type="password" id="password" name="password" class="password" required>
            <label for="password" class="l3">Password</label>
            <button type="submit">Registrar</button>
        </form>
    </div>
</body>
</html>
